<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Livelog</title>
    <style>
        :root {
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            color: #e7e9e5;
            background: #111512;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --muted: #929b91;
            --line: #2c342e;
            --panel: #171d19;
            --green: #b4ed75;
            --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 88% 0%, #263124 0, transparent 36%),
                linear-gradient(135deg, #111512, #141a16 58%, #111512);
        }

        button,
        input {
            font: inherit;
        }

        .shell {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 28px 26px 54px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 3px 0 24px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .mark {
            color: var(--green);
            font-size: 25px;
            line-height: 1;
        }

        h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 650;
        }

        .eyebrow {
            margin-top: 4px;
            color: var(--muted);
            font: 10px var(--mono);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font: 11px var(--mono);
        }

        .light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #7a817b;
            box-shadow: 0 0 0 4px #292e2a;
        }

        .connection[data-state="connected"] {
            color: var(--green);
        }

        .connection[data-state="connected"] .light {
            background: var(--green);
            box-shadow: 0 0 13px #a6e96c80;
        }

        .connection[data-state="error"] {
            color: #f18c71;
        }

        .connection[data-state="error"] .light {
            background: #f18c71;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 0 15px;
        }

        .count {
            color: var(--muted);
            font: 11px var(--mono);
            white-space: nowrap;
        }

        .count strong {
            color: #e7e9e5;
            font-weight: 500;
        }

        .spacer {
            flex: 1;
        }

        input[type="search"] {
            width: min(260px, 42vw);
            height: 34px;
            padding: 0 11px;
            color: #e7e9e5;
            background: #151a16;
            border: 1px solid var(--line);
            border-radius: 4px;
            outline: none;
            font-size: 12px;
        }

        input[type="search"]:focus {
            border-color: #718b5c;
        }

        button {
            height: 34px;
            padding: 0 11px;
            color: #c3c9c2;
            background: #1a201b;
            border: 1px solid var(--line);
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        button:hover {
            border-color: #52614f;
            color: white;
        }

        .stream-head,
        .event {
            display: grid;
            grid-template-columns: 90px 135px minmax(0, 1fr) 24px;
            align-items: start;
            column-gap: 14px;
        }

        .stream-head {
            padding: 10px 14px;
            color: #778078;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            font: 9px var(--mono);
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        #events {
            border-bottom: 1px solid var(--line);
        }

        .event {
            padding: 13px 14px;
            border-bottom: 1px solid #222a24;
            animation: appear .18s ease-out both;
        }

        .event:last-child {
            border-bottom: 0;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .time,
        .type,
        .event-id {
            font: 10px var(--mono);
        }

        .time {
            padding-top: 2px;
            color: #8d968d;
        }

        .type {
            padding-top: 1px;
            color: #b7c1b3;
        }

        .type[data-type="exception"] {
            color: #f18c71;
        }

        .type[data-type="dump"] {
            color: #e6c478;
        }

        .type[data-type="message"] {
            color: var(--green);
        }

        .summary {
            min-width: 0;
        }

        .summary-text {
            overflow-wrap: anywhere;
            color: #e4e8e2;
            font-size: 12px;
            line-height: 1.55;
        }

        .event-meta {
            margin-top: 6px;
            color: #7f897f;
            font: 9px var(--mono);
            overflow-wrap: anywhere;
        }

        .event-meta span+span::before {
            content: " / ";
            color: #4c554d;
        }

        .disclosure {
            width: 24px;
            height: 24px;
            padding: 0;
            color: #788178;
            border: 0;
            background: transparent;
            font-size: 14px;
        }

        .payload {
            display: none;
            margin: 10px 0 0;
            padding: 11px;
            overflow: auto;
            color: #c6d2c1;
            background: #111612;
            border: 1px solid #29332a;
            border-radius: 3px;
            font: 10px/1.55 var(--mono);
            white-space: pre-wrap;
        }

        .event.expanded .payload {
            display: block;
        }

        .empty {
            display: grid;
            justify-items: center;
            padding: 90px 20px;
            text-align: center;
        }

        .empty-mark {
            color: #718a59;
            font: 35px var(--mono);
        }

        .empty-title {
            margin-top: 15px;
            color: #d7ddd5;
            font-size: 14px;
        }

        .empty-copy {
            max-width: 410px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
        }

        .empty code {
            color: #c0dd9c;
            font: 10px var(--mono);
        }

        .test-suite {
            margin: 2px 0 18px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #151a16;
        }

        .test-suite[hidden] {
            display: none;
        }

        .test-heading {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #dce3d9;
            font-size: 11px;
        }

        .test-summary {
            color: var(--muted);
            font: 10px var(--mono);
        }

        .test-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px 12px;
            margin-top: 10px;
        }

        .test-result {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #aab3a8;
            font: 9px var(--mono);
        }

        .test-result[data-state="passed"] .test-result-state {
            color: var(--green);
        }

        .test-result[data-state="failed"] .test-result-state {
            color: #f18c71;
        }

        @media (max-width: 680px) {
            .shell {
                padding: 20px 14px 38px;
            }

            header {
                align-items: flex-start;
            }

            .stream-head,
            .event {
                grid-template-columns: 70px minmax(76px, 100px) minmax(0, 1fr) 22px;
                column-gap: 8px;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .spacer {
                flex-basis: 10px;
            }

            input[type="search"] {
                width: 100%;
                order: 3;
            }

            .stream-head {
                padding-inline: 8px;
                font-size: 8px;
            }

            .event {
                padding: 12px 8px;
            }

            .time,
            .type {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header>
            <div class="brand">
                <span class="mark" aria-hidden="true">◉</span>
                <div>
                    <h1>Livelog</h1>
                    <div class="eyebrow">Live event stream</div>
                </div>
            </div>
            <div id="connection" class="connection" data-state="connecting" role="status">
                <span class="light" aria-hidden="true"></span><span id="connection-label">Connecting</span>
            </div>
        </header>

        <section aria-label="Event stream">
            <div class="toolbar">
                <div class="count"><strong id="event-count">0</strong> events</div>
                <div class="count"><strong id="session-count">0</strong> sessions</div>
                <span class="spacer"></span>
                <input id="search" type="search" placeholder="Search events" aria-label="Search events">
                <button id="run-tests" type="button" title="Post all LLP event types and verify WebSocket delivery"
                    disabled>Run LLP test suite</button>
                <button id="clear" type="button" title="Clear events from this view">Clear view</button>
            </div>
            <div id="test-suite" class="test-suite" aria-live="polite" hidden>
                <div class="test-heading"><strong>WebSocket round-trip</strong><span id="test-summary"
                        class="test-summary"></span></div>
                <div id="test-results" class="test-results"></div>
            </div>
            <div class="stream-head" aria-hidden="true">
                <span>Time</span><span>Event</span><span>Payload</span><span></span>
            </div>
            <div id="events" aria-live="polite">
                <div class="empty" id="empty">
                    <div class="empty-mark" aria-hidden="true">⌁</div>
                    <div class="empty-title">Waiting for events</div>
                    <div class="empty-copy">Start an SDK or POST an LLP v1 event to <code>/api/events</code>. New events
                        will appear here as they arrive.</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const connection = document.querySelector("#connection");
        const connectionLabel = document.querySelector("#connection-label");
        const eventsElement = document.querySelector("#events");
        const emptyElement = document.querySelector("#empty");
        const searchElement = document.querySelector("#search");
        const runTestsButton = document.querySelector("#run-tests");
        const testSuiteElement = document.querySelector("#test-suite");
        const testResultsElement = document.querySelector("#test-results");
        const testSummaryElement = document.querySelector("#test-summary");
        const retainedEvents = [];
        const pendingTests = new Map();
        const maxEvents = 300;
        let socket;
        let reconnectDelay = 500;

        function websocketUrl() {
            if (location.protocol === "file:") return "ws://localhost:5092/api/live";
            const scheme = location.protocol === "https:" ? "wss:" : "ws:";
            return `${scheme}//${location.host}/api/live`;
        }

        function apiUrl(path) {
            const origin = location.protocol === "file:" ? "http://localhost:5092" : location.origin;
            return `${origin}${path}`;
        }

        function setConnection(state, label) {
            connection.dataset.state = state;
            connectionLabel.textContent = label;
        }

        function eventSummary(event) {
            switch (event.type) {
                case "message": return event.message;
                case "dump": return `${event.label ?? "Dump"}: ${JSON.stringify(event.value)}`;
                case "spacer": return event.label ?? "Spacer";
                case "group-start": return `Start group: ${event.name}`;
                case "group-end": return "End group";
                case "exception": return `${event.exceptionType}: ${event.message}`;
                case "request-start": return `${event.method} ${event.path}`;
                case "request-end": return `Completed with ${event.statusCode ?? "unknown status"} in ${event.duration ?? "unknown duration"}`;
                case "timer": return `${event.name}: ${event.duration}`;
                default: return JSON.stringify(event);
            }
        }

        function makeTestEvents(sessionId) {
            const common = {
                version: 1,
                timestamp: new Date().toISOString(),
                sessionId,
                source: { file: "Livelog.Web test suite", line: 1 }
            };
            return [
                { type: "message", message: "LLP test: message" },
                {
                    type: "dump",
                    label: "LLP test dump",
                    value: {
                        kind: "object",
                        class: "TestPayload",
                        properties: [{ name: "message", value: { kind: "string", value: "nested value" } }]
                    }
                },
                { type: "spacer", label: "LLP test spacer" },
                { type: "group-start", name: "LLP test group" },
                { type: "group-end" },
                { type: "exception", exceptionType: "TestException", message: "LLP test exception", stackTrace: "at Livelog.Web test suite" },
                { type: "request-start", method: "GET", path: "/llp-test" },
                { type: "request-end", statusCode: 200, duration: "00:00:00.0250000" },
                { type: "timer", name: "LLP test timer", duration: "00:00:00.1250000" }
            ].map(event => ({ ...common, ...event, id: crypto.randomUUID() }));
        }

        function updateTestResult(eventType, state, detail = "") {
            let row = testResultsElement.querySelector(`[data-event-type="${eventType}"]`);
            if (!row) {
                row = document.createElement("div");
                row.className = "test-result";
                row.dataset.eventType = eventType;
                const name = document.createElement("span");
                name.textContent = eventType;
                const status = document.createElement("span");
                status.className = "test-result-state";
                row.append(name, status);
                testResultsElement.append(row);
            }
            row.dataset.state = state;
            row.querySelector(".test-result-state").textContent = detail || state;
        }

        async function runTestSuite() {
            if (socket?.readyState !== WebSocket.OPEN) return;

            runTestsButton.disabled = true;
            testSuiteElement.hidden = false;
            testResultsElement.replaceChildren();
            const testEvents = makeTestEvents(`browser-test-${crypto.randomUUID()}`);
            let passed = 0;
            let failed = 0;
            testSummaryElement.textContent = `0 / ${testEvents.length} received`;

            for (const event of testEvents) {
                updateTestResult(event.type, "waiting", "waiting");
                const received = new Promise(resolve => {
                    const timeout = window.setTimeout(() => {
                        pendingTests.delete(event.id);
                        resolve(false);
                    }, 5000);
                    pendingTests.set(event.id, receivedEvent => {
                        window.clearTimeout(timeout);
                        resolve(receivedEvent);
                    });
                });

                try {
                    const response = await fetch(apiUrl("/api/events"), {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(event)
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const wasReceived = await received;
                    if (!wasReceived) throw new Error("No WebSocket event received within 5 seconds");
                    if (wasReceived.type !== event.type) throw new Error(`Received type ${wasReceived.type ?? "missing"}`);
                    passed++;
                    updateTestResult(event.type, "passed", "received");
                } catch (error) {
                    pendingTests.delete(event.id);
                    failed++;
                    updateTestResult(event.type, "failed", error.message);
                }

                testSummaryElement.textContent = `${passed} / ${testEvents.length} received${failed ? ` · ${failed} failed` : ""}`;
            }

            runTestsButton.disabled = socket?.readyState !== WebSocket.OPEN;
        }

        function renderEvents() {
            const query = searchElement.value.trim().toLowerCase();
            eventsElement.replaceChildren();
            const visibleEvents = retainedEvents.filter(event =>
                !query || JSON.stringify(event).toLowerCase().includes(query));

            document.querySelector("#event-count").textContent = retainedEvents.length;
            document.querySelector("#session-count").textContent = new Set(
                retainedEvents.map(event => event.sessionId).filter(Boolean)
            ).size;

            if (visibleEvents.length === 0) {
                emptyElement.querySelector(".empty-title").textContent = retainedEvents.length ? "No matching events" : "Waiting for events";
                emptyElement.querySelector(".empty-copy").textContent = retainedEvents.length
                    ? "Try a different search."
                    : "Start an SDK or POST an LLP v1 event to /api/events. New events will appear here as they arrive.";
                eventsElement.append(emptyElement);
                return;
            }

            for (const event of visibleEvents) {
                const row = document.createElement("article");
                row.className = "event";

                const time = document.createElement("time");
                time.className = "time";
                const timestamp = new Date(event.timestamp);
                time.dateTime = Number.isNaN(timestamp.getTime()) ? "" : timestamp.toISOString();
                time.textContent = Number.isNaN(timestamp.getTime()) ? "--:--:--" : timestamp.toLocaleTimeString([], { hour12: false });

                const type = document.createElement("div");
                type.className = "type";
                type.dataset.type = event.type ?? "unknown";
                type.textContent = event.type ?? "unknown";

                const summary = document.createElement("div");
                summary.className = "summary";
                const text = document.createElement("div");
                text.className = "summary-text";
                text.textContent = eventSummary(event);
                summary.append(text);

                const metadata = document.createElement("div");
                metadata.className = "event-meta";
                for (const value of [event.source?.file, event.source?.line && `line ${event.source.line}`, event.sessionId && `session ${event.sessionId}`]) {
                    if (!value) continue;
                    const item = document.createElement("span");
                    item.textContent = value;
                    metadata.append(item);
                }
                if (metadata.childElementCount) summary.append(metadata);

                const disclosure = document.createElement("button");
                disclosure.className = "disclosure";
                disclosure.type = "button";
                disclosure.title = "Show event payload";
                disclosure.setAttribute("aria-label", "Show event payload");
                disclosure.textContent = "+";
                const payload = document.createElement("pre");
                payload.className = "payload";
                payload.textContent = JSON.stringify(event, null, 2);
                disclosure.addEventListener("click", () => {
                    const expanded = row.classList.toggle("expanded");
                    disclosure.textContent = expanded ? "−" : "+";
                    disclosure.title = expanded ? "Hide event payload" : "Show event payload";
                    disclosure.setAttribute("aria-label", disclosure.title);
                });
                summary.append(payload);
                row.append(time, type, summary, disclosure);
                eventsElement.append(row);
            }
        }

        function connect() {
            setConnection("connecting", "Connecting");
            socket = new WebSocket(websocketUrl());
            socket.addEventListener("open", () => {
                reconnectDelay = 500;
                setConnection("connected", "Connected");
                runTestsButton.disabled = false;
            });
            socket.addEventListener("message", message => {
                try {
                    const event = JSON.parse(message.data);
                    pendingTests.get(event.id)?.(event);
                    pendingTests.delete(event.id);
                    retainedEvents.unshift(event);
                    if (retainedEvents.length > maxEvents) retainedEvents.length = maxEvents;
                    renderEvents();
                } catch {
                    setConnection("error", "Invalid event");
                }
            });
            socket.addEventListener("error", () => setConnection("error", "Connection issue"));
            socket.addEventListener("close", () => {
                setConnection("connecting", "Reconnecting");
                runTestsButton.disabled = true;
                window.setTimeout(connect, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            });
        }

        searchElement.addEventListener("input", renderEvents);
        runTestsButton.addEventListener("click", runTestSuite);
        document.querySelector("#clear").addEventListener("click", () => {
            retainedEvents.length = 0;
            renderEvents();
        });

        connect();
    </script>
</body>

</html>
